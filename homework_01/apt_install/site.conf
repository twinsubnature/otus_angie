server {
    listen 8081;
    server_name _;
    root /usr/share/angie/html;

    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_static on;
    brotli_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml;

    zstd on;
    zstd_comp_level 3;
    zstd_min_length 256;
    zstd_static on;
    zstd_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
